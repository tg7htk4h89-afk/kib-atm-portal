<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Machine Detail — KIB RBD Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <button class="mobile-menu-btn" onclick="toggleMobileSidebar()" id="mobile-menu-btn">☰</button>
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeMobileSidebar()"></div>

  <div class="layout">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-logo">
        <div class="logo-title">🏧 KIB RBD Portal</div>
        <div class="logo-sub">Machine Detail</div>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">Navigation</div>
        <a href="manager.html" class="nav-item">
          <span class="nav-icon">📊</span> Dashboard
        </a>
        <a href="manager.html#machines" class="nav-item">
          <span class="nav-icon">🏧</span> All Machines
        </a>
        <a href="manager.html#incidents" class="nav-item">
          <span class="nav-icon">⚠️</span> Incidents
        </a>
        <div class="nav-section">Operations</div>
        <a href="branch.html" class="nav-item">
          <span class="nav-icon">📋</span> Submit Checklist
        </a>
        <a href="vendor.html" class="nav-item">
          <span class="nav-icon">🔧</span> Vendor View
        </a>
        <div class="nav-section">Workforce</div>
        <a href="wfm.html" class="nav-item" style="border-left:3px solid #B8860B">
          <span class="nav-icon">👥</span> WFM Portal
        </a>
      </nav>
      <div class="sidebar-footer">
        <div id="nav-user"></div>
        <button id="logout-btn">Sign Out</button>
      </div>
    </aside>

    <!-- Main -->
    <div class="main-content">
      <div class="page-header">
        <h1 id="machinePageTitle">Loading machine...</h1>
        <a href="manager.html" class="btn btn-secondary btn-sm">← Back</a>
      </div>

      <div class="page-body">

        <!-- Loading / Error -->
        <div id="loadingSection">
          <div style="display:flex;align-items:center;gap:12px;padding:20px;color:#64748b">
            <div class="spinner"></div>
            <span>Loading machine data...</span>
          </div>
        </div>

        <!-- Machine Detail Content -->
        <div id="machineDetailSections" style="display:none">

          <!-- Machine Info -->
          <div class="card mb-5">
            <div class="card-header">
              <div class="card-title">🏧 Machine Information</div>
            </div>
            <div class="card-body" id="machineInfoCard"></div>
          </div>

          <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
            <!-- Stats -->
            <div class="card">
              <div class="card-header"><div class="card-title">📊 Activity</div></div>
              <div class="card-body" id="activityStatsCard"></div>
            </div>
            <!-- Current Incident -->
            <div class="card">
              <div class="card-header"><div class="card-title">⚠️ Current Incident</div></div>
              <div class="card-body" id="currentIncidentCard"></div>
            </div>
          </div>

          <!-- Last Checklist -->
          <div class="card mb-5">
            <div class="card-header"><div class="card-title">📋 Last Checklist</div></div>
            <div class="card-body" id="lastChecklistCard"></div>
          </div>

          <!-- Incident History -->
          <div class="card">
            <div class="card-header"><div class="card-title">📂 Incident History</div></div>
            <div class="card-body-tight" id="incidentHistoryCard"></div>
          </div>

        </div><!-- /machineDetailSections -->

      </div><!-- /page-body -->
    </div><!-- /main-content -->
  </div><!-- /layout -->

  <div id="toast-container"></div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/machine-detail.js"></script>
  <script>
    function toggleMobileSidebar(){
      document.querySelector('.sidebar').classList.toggle('open');
      document.getElementById('sidebar-overlay').classList.toggle('active');
    }
    function closeMobileSidebar(){
      document.querySelector('.sidebar').classList.remove('open');
      document.getElementById('sidebar-overlay').classList.remove('active');
    }
  </script>
</body>
</html>
